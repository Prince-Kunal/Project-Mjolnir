name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - name: Shared rule cases are in sync with the SQL tests
        run: |
          pnpm gen:shared-tests
          git diff --exit-code supabase/tests/03_scoring_cases.test.sql supabase/tests/05_streak_cases.test.sql
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  functions:
    name: Edge Functions (Deno)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2.0.5
        with:
          deno-version: v2.x
      - run: deno lint --config supabase/functions/deno.json supabase/functions
      - run: deno test --allow-env --allow-net --config supabase/functions/deno.json supabase/functions

  database:
    name: Database (pgTAP, generated types)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v3
        with:
          version: 2.118.0
      - run: supabase db start
      - run: supabase test db
      - name: Generated types are up to date
        run: |
          supabase gen types typescript --local > packages/db-types/src/database.ts
          git diff --exit-code packages/db-types/src/database.ts

  e2e:
    name: End-to-end (Playwright, local stack)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: supabase/setup-cli@v3
        with:
          version: 2.118.0
      - name: Placeholder secrets for config.toml
        run: |
          cat > supabase/.env <<ENV
          GOOGLE_CLIENT_ID=ci.apps.googleusercontent.com
          GOOGLE_CLIENT_SECRET=ci
          ENV
      - name: Start Supabase (database, auth, REST, realtime)
        run: supabase start -x studio,imgproxy,storage-api,logflare,vector,supavisor,edge-runtime,mailpit,postgres-meta
      - name: Point the web app at it
        run: |
          supabase status -o env --override-name api.url=VITE_SUPABASE_URL \
            --override-name auth.publishable_key=VITE_SUPABASE_PUBLISHABLE_KEY \
            | grep -E '^VITE_' > apps/web/.env.local
      - run: pnpm --filter @mjolnir/web exec playwright install --with-deps chromium
      - run: pnpm e2e
        env:
          CI: '1'
